---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: distro-test
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: latest # You can pin to a specific version of Fedora as well

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: akmods
    nvidia-driver: nvidia-open
    install: []

  - type: dnf
    repos:
      copr:
        - atim/starship
        - avengemedia/dms-git
        - imput/helium
        - faugus/faugus-launcher
        - yalter/niri-git
        - lionheartp/Hyprland
    install:
      packages:
        # CLI & Utilities
        - neovim
        - starship
        - fish
        - kitty
        - stow
        - cava

        # Thunar
        - thunar
        - xarchiver
        - thunar-archive-plugin   # Integrates xarchiver into Thunar's context menu
        - thunar-volman           # Automatic device management and auto-mounting
        - thunar-media-tags-plugin# View/edit ID3 and media tags directly

        # Thumbnail Generation
        - tumbler                 # D-Bus thumbnail generation service
        - ffmpegthumbnailer       # Video thumbnails
        - poppler-glib            # PDF thumbnails
        - freetype                # Font previews
        - libgsf                  # ODF/Office document previews

        # Filesystem & Mounting Backend
        - gvfs                    # Core backend for trash, network mounts, and storage
        - gvfs-mtp                # Android/MTP device support
        - gvfs-gphoto2            # Digital camera support
        - gvfs-smb                # Windows/Samba network share support
        - gvfs-fuse               # Exposes GVFS mounts to non-GVFS apps via FUSE

        # Browser
        - helium-bin

        # Window Manager & Shell
        - hyprland
        - greetd
        - dms
        - dms-greeter
        - adw-gtk3-theme
        - mate-polkit
        - xdg-desktop-portal
        - xdg-desktop-portal-gtk
        - xdg-desktop-portal-hyprland

        # Audio Stack
        - pipewire
        - wireplumber
        - pipewire-pulseaudio
        - pipewire-alsa
        - alsa-utils

        # Gaming & Performance
        - mangohud
        - mangohud.i686
        - gamemode.i686
        - steam
        - faugus-launcher
    remove:
      packages:
        - firefox
        - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

  - type: systemd
    system:
      enabled:
        - greetd.service
    user:
      enabled:
        - dms.service

  - type: default-flatpaks
    configurations:
      - notify: true # Send notification after install/uninstall is finished (true/false)
        scope: system
        # If no repo information is specified, Flathub will be used by default
        install: # system flatpaks we want all users to have and not remove
          - org.gnome.Loupe
          - com.github.wwmm.easyeffects
          - dev.zed.Zed
          - com.vysp3r.ProtonPlus
          - io.github.radiolamp.mangojuice
      - scope: user # Also add Flathub user repo, but no user packages

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
